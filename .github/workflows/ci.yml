name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze & test
    # ubuntu, not windows-latest: this job has no PowerShell dependency, and
    # windows-latest's default core.autocrlf=true reintroduces CRLF against
    # this repo's LF-normalized (.gitattributes eol=lf) source, which false-
    # fails line-ending-sensitive tests that pass everywhere else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned, not floating "stable": an unpinned channel silently picks
          # up whatever Flutter/Dart patch shipped on the runner that day, so
          # `flutter analyze` can start failing on CI with nothing in the diff
          # to explain it (new default lint promoted to error) while every
          # local machine still analyzes clean on an older stable build.
          # Bump deliberately alongside a local `flutter upgrade` + re-test.
          flutter-version: "3.50.0"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  functions:
    name: Cloud Functions lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  rules-test:
    name: Firestore & Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # Both manifests: this job installs root AND functions dependencies,
          # so the cache key has to move when either lockfile does.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          # firebase-tools' bundled emulators require Java 21+. Reachable
          # locally too, through Android Studio's bundled JBR -- the whole
          # suite was run that way on 2026-11-12 (44/44). Keep this job
          # anyway: it is the only place the rules are checked on every push.
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      # `npm run rules:test` starts with `npm --prefix functions run build`,
      # which needs functions/node_modules. Without this step the job died on
      # tsc before the emulator ever started, so the Firestore and Storage
      # rules went unchecked on every push from 2026-10-25 to 2026-11-12 while
      # the job merely looked broken. A red check that never reached the
      # assertions is worse than no check: it reports a problem nobody reads.
      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions
      - run: node --test test/functions/release-candidate-env.test.mjs
      - run: node --test test/functions/source-encoding.test.mjs test/functions/auth-action.test.mjs
      - run: node scripts/audit-source-encoding.mjs lib functions/src site_pub scripts android/app/src ios/Runner
      - run: npm run rules:test:all

  secrets-scan:
    name: Tracked secrets scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\scripts\check-tracked-secrets.ps1

  contract:
    name: Admin / mobile contract check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-repo
      # Cross-repo checkout: the contract check reads files from the sibling
      # admin repo to catch drift a same-repo check can never see (that's the
      # whole point of this gate). ADFOOT_CROSS_REPO_TOKEN needs at least
      # read access to Amidoukone/Show_talent_web.
      - uses: actions/checkout@v4
        with:
          repository: Amidoukone/Show_talent_web
          token: ${{ secrets.ADFOOT_CROSS_REPO_TOKEN }}
          path: admin-repo
      - shell: powershell
        working-directory: mobile-repo
        run: .\scripts\check-admin-mobile-contract.ps1 -Strict -AdminRepoPath "${{ github.workspace }}\admin-repo"
