// ============================================================================
// Root-level build.gradle
// Compatible with Flutter 3.50's AGP 9 built-in Kotlin migration and Gradle 9.5.
// ============================================================================

// One Firebase SDK version for every module.
//
// The FlutterFire plugins each apply the Firebase BoM themselves, reading
// `rootProject.ext.FirebaseSDKVersion` first and falling back to the version
// bundled in firebase_core's own gradle.properties. The :app module needs the
// BoM too -- it declares firebase-crashlytics-ndk, which has no version of its
// own -- and Crashlytics NDK must match the Crashlytics version exactly or the
// native reports do not attach to the Java ones.
//
// Declaring it here rather than in :app is what keeps those two from drifting:
// pinning it in :app alone would leave the plugins free to move without it.
// This value must be kept in step with firebase_core's default when that
// package is upgraded; `test/native_crash_reporting_guardrails_test.dart`
// fails if the two disagree.
ext.FirebaseSDKVersion = "34.19.0"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Shared build directory (standard Flutter structure).
rootProject.buildDir = "../build"

subprojects {
    // Each module (app + Flutter plugins) has its own build directory.
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Flutter requires every plugin module to depend on :app.
    project.evaluationDependsOn(":app")
}

// Global clean task used by flutter clean.
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
