// ============================================================================
// Root-level build.gradle
// Compatible with Flutter 3.32.7 / AGP 8.6.1 / Gradle 8.9 / Kotlin 1.8.22
// ============================================================================

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Shared build directory (standard Flutter structure).
rootProject.buildDir = "../build"

subprojects {

    // Each module (app + Flutter plugins) has its own build directory.
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Flutter requires every plugin module to depend on :app.
    project.evaluationDependsOn(":app")

    // Critical guardrail: force Kotlin.
    // Avoids errors like "Too many arguments for public constructor String()"
    // on package_info_plus, cloud_functions, etc.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion("1.8.22")
                details.because("Force Kotlin version for Flutter plugins compatibility")
            }
        }
    }
}

// Global clean task used by flutter clean.
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
