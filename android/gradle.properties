org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.compiler.execution.strategy=in-process
# Some bundled Flutter plugins still apply the Kotlin Gradle Plugin. Flutter
# documents this as the temporary AGP 9 compatibility path; remove it only
# once all such plugins have migrated to built-in Kotlin.
android.builtInKotlin=false
# The same unmigrated plugins still rely on the legacy AGP DSL. This must stay
# false until their upstream AGP 9 migrations are available.
android.newDsl=false
