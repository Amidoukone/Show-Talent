import java.io.FileInputStream
import java.util.Properties

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.adfoot.app"
    compileSdk = 36
    buildToolsVersion = "35.0.0"
    ndkVersion = "29.0.13599879"

    defaultConfig {
        applicationId = "org.adfoot.app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        ndk {
            // Both ARM ABIs on purpose. Play's rule is that a 64-bit variant
            // must be *present*, not that the 32-bit one must be dropped —
            // shipping arm64-v8a alone made the app simply invisible on the
            // Play Store for every armeabi-v7a handset, which is a real share
            // of the entry-level devices this audience actually owns.
            //
            // x86/x86_64 stay out: they only serve emulators, and the app
            // bundle splits per ABI anyway, so adding armeabi-v7a costs
            // download size on no one — each device downloads only its own.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    flavorDimensions += "environment"
    productFlavors {
        local {
            dimension "environment"
            applicationIdSuffix ".local"
            resValue "string", "app_name", "Adfoot Local"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Adfoot Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Adfoot"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // For CI/local validation without key.properties, fallback remains debug-signed.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // Debug standard
        }
    }

    packagingOptions {
        jniLibs {
            // Keep native library packaging explicit for Play's 16 KB page-size
            // compatibility path. NDK r29 handles 16 KB ELF alignment.
            useLegacyPackaging true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.multidex:multidex:2.0.1"
}
