import java.io.FileInputStream
import java.util.Properties

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.adfoot.app"
    compileSdk = 36
    buildToolsVersion = "35.0.0"
    ndkVersion = "29.0.13599879"

    defaultConfig {
        applicationId = "org.adfoot.app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        ndk {
            // Both ARM ABIs must ship. Play's rule is that a 64-bit variant
            // must be *present*, not that the 32-bit one must be dropped --
            // shipping arm64-v8a alone made the app simply invisible on the
            // Play Store for every armeabi-v7a handset, which is a real share
            // of the entry-level devices this audience actually owns.
            //
            // This line is not what delivers that, and the artifact says so:
            // the shipped bundle carries armeabi-v7a, arm64-v8a *and* x86_64.
            // The Flutter Gradle plugin calls abiFilters.clear() then
            // addAll(PLATFORM_ABI_LIST) on defaultConfig -- see
            // configureAbiWithoutSplits in FlutterPlugin.kt -- so whatever is
            // written here is replaced on every build by its own list of
            // arm32 + arm64 + x86_64. (The plugin's own comment claims user
            // filters take precedence; the code does not, and the bundle
            // agrees with the code.)
            //
            // The line stays as the fallback for the two cases where the
            // plugin stands back and this value becomes live again:
            // --split-per-abi, and the `disable-abi-filtering` Gradle
            // property.
            //
            // Shipping x86_64 costs users nothing -- Play splits the bundle
            // per ABI, so each device downloads only its own -- and it is
            // what keeps the app installable on x86_64 Chromebooks and
            // emulators. There is no reason to fight the plugin for it.
            //
            // The ABI set is only ever true of an artifact, so verify it
            // there: scripts/check-aab-native-alignment.ps1
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    flavorDimensions += "environment"
    productFlavors {
        local {
            dimension "environment"
            applicationIdSuffix ".local"
            resValue "string", "app_name", "Adfoot Local"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Adfoot Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Adfoot"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // For CI/local validation without key.properties, fallback remains debug-signed.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // Debug standard
        }
    }

    packagingOptions {
        jniLibs {
            // Uncompressed, which is the recommended path from AGP 8.5.1 on and
            // what this project builds with (8.11.1). `useLegacyPackaging true`
            // is documented as the fallback for AGP 8.5 and below.
            //
            // 16 KB page-size compliance does NOT come from this flag: it comes
            // from ELF segment alignment, supplied by NDK r29. Verified on the
            // shipped bundle -- every 64-bit LOAD segment reports p_align 16384
            // or 65536.
            //
            // What the flag actually decided was how many copies of each .so
            // live on the device. Compressed, Android extracts them into
            // /data at install time, so the APK's copy and the extracted copy
            // coexist: ~8.9 MB of duplicate arm64 payload (~8.5 MB on
            // armeabi-v7a) on exactly the low-storage handsets this audience
            // owns, and Google's own guidance warns it makes installs fail more
            // often. Play compresses at delivery either way, so the download
            // does not grow.
            useLegacyPackaging false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.multidex:multidex:2.0.1"

    // Native crash reporting.
    //
    // The Crashlytics Flutter plugin reports Dart errors, and the Android
    // Crashlytics SDK reports uncaught Java/Kotlin exceptions. Neither of them
    // sees a native signal -- a SIGSEGV or SIGABRT raised inside the media
    // stack -- and that is precisely the hole 1.0.7+24 fell into: the app died
    // during playback on 2026-08-23 and Crashlytics reported 100% crash-free
    // users *and* sessions for the release, because no exception was ever
    // raised on either side.
    //
    // The version comes from the BoM pinned in the root build.gradle, which is
    // the same one the FlutterFire plugins resolve against.
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.FirebaseSDKVersion}")
    implementation "com.google.firebase:firebase-crashlytics-ndk"
}
