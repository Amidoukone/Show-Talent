definitions:
  flutter_setup: &flutter_setup
    name: Get Flutter packages
    script: |
      set -e
      flutter packages pub get
  pod_install: &pod_install
    name: Install CocoaPods dependencies
    script: |
      set -e
      find . -name "Podfile" -maxdepth 2 -execdir pod install \;
  fetch_signing_files: &fetch_signing_files
    name: Fetch signing files from App Store Connect
    script: |
      set -e
      app-store-connect fetch-signing-files "$BUNDLE_ID" \
        --type IOS_APP_STORE \
        --create
  keychain_setup: &keychain_setup
    name: Set up keychain and certificates for code signing
    script: |
      set -e
      keychain initialize
      keychain add-certificates
  use_profiles: &use_profiles
    name: Apply the fetched provisioning profile to the Xcode project
    script: |
      set -e
      xcode-project use-profiles
  artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log

workflows:
  # ---------------------------------------------------------------------
  # iOS - Staging - TestFlight (internal testing)
  #
  # Mirrors the Android flow the team already uses for build 33: an
  # internal-test build before anything goes further. Bundle ID and scheme
  # match ios/Runner.xcodeproj (staging.xcscheme, org.adfoot.app.staging)
  # and android/app/build.gradle's `staging` flavor.
  # ---------------------------------------------------------------------
  ios-staging:
    name: iOS - Staging - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.2 # Pinned to match .github/workflows/ci.yml.
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.adfoot.app.staging"
        XCODE_SCHEME: "staging"
      groups:
        # Create this group in Codemagic > Team settings > Environment
        # variables *only if* you end up needing raw App Store Connect API
        # values here directly (most setups don't: the App Store Connect
        # integration below supplies them). See the setup runbook.
        - appstore_credentials
    integrations:
      # Name of the App Store Connect integration you create in Codemagic
      # under Team settings > Integrations > Apple Developer Portal.
      # Rename this to whatever you call it there.
      app_store_connect: adfoot_app_store_connect
    scripts:
      - *flutter_setup
      - *pod_install
      - *keychain_setup
      - *fetch_signing_files
      - *use_profiles
      - name: Flutter build ipa (staging flavor)
        script: |
          set -e
          flutter build ipa --release \
            --flavor staging \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - koneamidou27@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------
  # iOS - Production - TestFlight
  #
  # Same shape as ios-staging, targeting the production bundle ID and
  # Firebase project. Kept at "submit_to_testflight: true" /
  # "submit_to_app_store: false" deliberately -- promoting a TestFlight
  # build to the public App Store listing is a separate, deliberate action
  # in App Store Connect once you're ready, not something this pipeline
  # should do on its own.
  # ---------------------------------------------------------------------
  ios-production:
    name: iOS - Production - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.adfoot.app"
        XCODE_SCHEME: "production"
      groups:
        - appstore_credentials
    integrations:
      app_store_connect: adfoot_app_store_connect
    scripts:
      - *flutter_setup
      - *pod_install
      - *keychain_setup
      - *fetch_signing_files
      - *use_profiles
      - name: Flutter build ipa (production flavor)
        script: |
          set -e
          flutter build ipa --release \
            --flavor production \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - koneamidou27@gmail.com
        notify:
          success: true
          failure: true
