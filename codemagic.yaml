definitions:
  flutter_setup: &flutter_setup
    name: Get Flutter packages
    script: |
      set -e
      flutter packages pub get
  pod_install: &pod_install
    name: Install CocoaPods dependencies
    script: |
      set -e
      find . -name "Podfile" -maxdepth 2 -execdir pod install \;
  keychain_initialize: &keychain_initialize
    name: Set up keychain to store code signing certificates
    script: |
      set -e
      keychain initialize
  fetch_signing_files: &fetch_signing_files
    name: Fetch signing files from App Store Connect
    script: |
      set -e
      app-store-connect fetch-signing-files "$BUNDLE_ID" \
        --type IOS_APP_STORE \
        --create
  keychain_add_certificates: &keychain_add_certificates
    name: Add certificates to keychain
    script: |
      set -e
      keychain add-certificates
  use_profiles: &use_profiles
    name: Apply the fetched provisioning profile to the Xcode project
    script: |
      set -e
      xcode-project use-profiles
  artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log

workflows:
  # ---------------------------------------------------------------------
  # iOS - Staging - TestFlight (internal testing)
  #
  # Mirrors the Android flow the team already uses for build 33: an
  # internal-test build before anything goes further. Bundle ID and scheme
  # match ios/Runner.xcodeproj (staging.xcscheme, org.adfoot.app.staging)
  # and android/app/build.gradle's `staging` flavor.
  # ---------------------------------------------------------------------
  ios-staging:
    name: iOS - Staging - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.2 # Pinned to match .github/workflows/ci.yml.
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.adfoot.app.staging"
        XCODE_SCHEME: "staging"
      groups:
        # Create this group in Codemagic > Team settings > Environment
        # variables *only if* you end up needing raw App Store Connect API
        # values here directly (most setups don't: the App Store Connect
        # integration below supplies them). See the setup runbook.
        - appstore_credentials
        # FIREBASE_IOS_API_KEY, FIREBASE_IOS_APP_ID, FIREBASE_PROJECT_ID,
        # FIREBASE_MESSAGING_SENDER_ID, FIREBASE_STORAGE_BUCKET, APP_ENV --
        # values taken from ios/Firebase/staging/GoogleService-Info.plist
        # (gitignored, not read natively by the app -- the real Firebase
        # config only reaches the app through --dart-define below). Without
        # this group the app runs on firebase_options.dart's placeholder
        # values and Firebase crashes it on launch (real incident, see
        # runbook).
        - firebase_ios_staging
    integrations:
      # Name of the App Store Connect integration you create in Codemagic
      # under Team settings > Integrations > Apple Developer Portal.
      # Rename this to whatever you call it there.
      app_store_connect: adfoot_app_store_connect
    scripts:
      - *flutter_setup
      - *pod_install
      - *keychain_initialize
      - *fetch_signing_files
      - *keychain_add_certificates
      - *use_profiles
      - name: Flutter build ipa (staging flavor)
        script: |
          set -e
          flutter build ipa --release \
            --flavor staging \
            -t lib/main.dart \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - koneamidou27@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------
  # iOS - Production - TestFlight
  #
  # Same shape as ios-staging, targeting the production bundle ID and
  # Firebase project. Kept at "submit_to_testflight: true" /
  # "submit_to_app_store: false" deliberately -- promoting a TestFlight
  # build to the public App Store listing is a separate, deliberate action
  # in App Store Connect once you're ready, not something this pipeline
  # should do on its own.
  # ---------------------------------------------------------------------
  ios-production:
    name: iOS - Production - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.adfoot.app"
        XCODE_SCHEME: "production"
      groups:
        - appstore_credentials
        # Same rationale as ios-staging's firebase_ios_staging group, values
        # from ios/Firebase/production/GoogleService-Info.plist instead.
        - firebase_ios_production
    integrations:
      app_store_connect: adfoot_app_store_connect
    scripts:
      - *flutter_setup
      - *pod_install
      - *keychain_initialize
      - *fetch_signing_files
      - *keychain_add_certificates
      - *use_profiles
      - name: Flutter build ipa (production flavor)
        script: |
          set -e
          flutter build ipa --release \
            --flavor production \
            -t lib/main.dart \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - koneamidou27@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------
  # iOS - Simulator Preview (manual, no signing, no publishing)
  #
  # Not for shipping anything -- for looking at the app. Builds an unsigned
  # simulator binary (no Apple certificate/provisioning profile needed at
  # all), boots an iOS Simulator on the Mac runner, installs and launches
  # the app on it, then idles so you can connect to the runner's desktop
  # over VNC and use the Simulator interactively, live, from Windows,
  # without owning a Mac or an iPhone.
  #
  # How to use it:
  #   1. Install a VNC client on Windows (e.g. RealVNC Viewer:
  #      https://www.realvnc.com/en/connect/download/viewer/windows/).
  #   2. Codemagic > this app > pick this workflow > "Start new build" >
  #      tick "Enable SSH/VNC access" in the start-build dialog. Without
  #      this box checked, none of the rest works.
  #   3. Once the build is running, click "Explore build machine via SSH or
  #      VNC/RDP client" above the build steps for the host:port and
  #      credentials, and enter them in the VNC client.
  #   4. Wait for the "Boot Simulator and launch the app" step below to
  #      finish (a few minutes) -- the Simulator window then appears on the
  #      remote desktop with Adfoot (staging) already running. Interact
  #      with it like a real phone: tap, type, scroll.
  #   5. The final step just sleeps to keep the VM (and your VNC session)
  #      alive for the rest of max_build_duration. Cancel the build from
  #      the Codemagic dashboard whenever you're done early.
  # ---------------------------------------------------------------------
  ios-simulator-preview:
    name: iOS - Simulator Preview
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "staging"
      groups:
        # Same real-config gap as ios-staging (see its firebase_ios_staging
        # comment): without this, Firebase crashes the app on launch --
        # confirmed by an actual crash (EXC_CRASH/SIGABRT in
        # +[FIRApp configureWithName:options:]) on 2026-09-12, the first
        # time this app was ever really executed on iOS.
        - firebase_ios_staging
    scripts:
      - *flutter_setup
      - *pod_install
      - name: Flutter build for iOS Simulator (staging flavor, unsigned)
        script: |
          set -e
          flutter build ios --debug --simulator \
            --flavor staging \
            -t lib/main.dart \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID" \
            --dart-define=FIREBASE_IOS_BUNDLE_ID="$FIREBASE_IOS_BUNDLE_ID"
      - name: Boot Simulator and launch the app
        script: |
          set -e
          DEVICE_LINE=$(xcrun simctl list devices available | grep -m1 "iPhone")
          echo "Simulateur choisi : $DEVICE_LINE"
          DEVICE_UDID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          xcrun simctl boot "$DEVICE_UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH=$(find build/ios/iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App trouvee : $APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          set +e
          xcrun simctl launch --console-pty "$DEVICE_UDID" org.adfoot.app.staging \
            > /tmp/adfoot_launch.log 2>&1 &
          LAUNCH_PID=$!
          sleep 20
          kill $LAUNCH_PID 2>/dev/null
          set -e

          echo "===== Sortie console de l'app (20s apres le lancement) ====="
          cat /tmp/adfoot_launch.log || echo "(rien capture)"
          echo "===== Rapports de crash recents pour Runner ====="
          find "$HOME/Library/Logs/DiagnosticReports" -iname "*Runner*" -mmin -10 2>/dev/null \
            -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; || echo "(aucun rapport de crash trouve)"
      - name: Keep the VM alive for interactive VNC use
        script: |
          set -e
          echo "Simulateur pret. Connecte-toi en VNC maintenant si ce n'est pas deja fait."
          sleep 2700
